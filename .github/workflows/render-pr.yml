name: Render check

on:
  pull_request:
    branches: [main]

# Read-only by design. `pull_request` gives fork PRs a read-only token and no
# secrets — do NOT switch this to `pull_request_target` to "fix" that.
permissions:
  contents: read

concurrency:
  group: render-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 14
