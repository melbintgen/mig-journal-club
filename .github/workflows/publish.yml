name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two deploys at once; a queued push supersedes an in-flight one.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # quarto-actions/publish requires checkout@v6 or later; older versions
      # fail with a credentials error when it pushes to gh-pages.
      - uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No R/Python setup needed: _freeze/ is committed, so nothing executes here.
      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
